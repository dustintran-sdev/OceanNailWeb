<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ocean Nail Spa</title>
        <link rel="stylesheet" href="css/styles.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <link href="https://fonts.googleapis.com/css2?family=Allura&display=swap"
      rel="stylesheet">
    </head>

    <body>
        <section class="full-gallery-section">
            <h1>Our Gallery</h1>
            <div class="full-gallery">
                <img src="images/IMG_2380.JPEG" atl="Nail design" class="gallery-photo">
                <img src="images/IMG_2399.JPEG" atl="Nail design" class="gallery-photo">
                <img src="images/IMG_2528.JPEG" atl="Nail design" class="gallery-photo">
                <img src="images/IMG_2554.JPEG" atl="Nail design" class="gallery-photo">
                <img src="images/IMG_2681.JPEG" atl="Nail design" class="gallery-photo">
                <img src="images/IMG_2699.JPEG" atl="Nail design" class="gallery-photo">
                <img src="images/IMG_2807.JPEG" atl="Nail design" class="gallery-photo">
                <img src="images/IMG_2933.JPEG" atl="Nail design" class="gallery-photo">
                <img src="images/IMG_3104.JPEG" atl="Nail design" class="gallery-photo">
                <img src="images/IMG_3105.JPEG" atl="Nail design" class="gallery-photo">
                <img src="images/IMG_3184.JPEG" atl="Nail design" class="gallery-photo">
            </div>
        </section>

        <div class="lightbox" id="lightbox">
            <button
                class="lightbox-close"
                id="lightbox-close"
                aria-label="Close image">
                &times;
            </button>

            <img
                class="lightbox-image"
                id="lightbox-image"
                src=""
                alt="">
        </div>

        <script src="js/gallery.js"></script>
    </body>
</html>
